<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A</title>
  <!-- Loads the Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
  <!-- The "?v=2" makes browsers fetch the newest style.css instead of an old
       saved copy. After changing style.css, raise the number (v=3, v=4...)
       on every page. -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- Hunt title: appears at the top of every page -->
  <!-- Logo (images/logo.png); its size is set by .hunt-title img in style.css -->
  <a class="hunt-title" href="index.html"><img src="images/logo.png" alt="A" width="139" height="120"></a>

  <main>
    <!--
      THE LIST OF PUZZLES
      Each line: a link to the puzzle page, plus an empty <span> where the
      solver's answer appears once they've solved it (data-solved-for must
      match the data-puzzle nickname on that puzzle's answer form).
    -->
    <ul class="puzzle-list">
      <li><a href="24.html">24</a><span class="solved-answer" data-solved-for="24"></span></li>
      <li><a href="bet.html">BET</a><span class="solved-answer" data-solved-for="bet"></span></li>
      <li><a href="tom.html">TOM</a><span class="solved-answer" data-solved-for="tom"></span></li>
      <!-- The final puzzle: its link is the empty-set symbol. The "final-link"
           class adds the gap above it (see style.css). aria-label gives
           screen readers a word to read instead of the symbol. -->
      <li class="final-link"><a href="final.html" aria-label="final puzzle">∅</a><span class="solved-answer" data-solved-for="final"></span></li>
    </ul>
  </main>

  <script src="check.js"></script>
</body>
</html>
