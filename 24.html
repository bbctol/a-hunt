<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24</title>
  <!-- Loads the Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
  <!-- The "?v=2" makes browsers fetch the newest style.css instead of an old
       saved copy. After changing style.css, raise the number (v=3, v=4...)
       on every page. -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- Logo (images/logo.png); its size is set by .hunt-title img in style.css -->
  <a class="hunt-title" href="index.html"><img src="images/logo.png" alt="A" width="139" height="120"></a>

  <main>
    <h1>24</h1>

    <!--
      THE PUZZLE AREA. This part is wider than the rest of the page.
      (Its layout is under "24" in style.css.)

      PART 1: THE EIGHT POSTERS, in two groups of four. Under each poster
      is a blank line. On narrower screens the second group of four moves
      underneath the first.
      To swap a poster, replace the file in images/24/ with the same name.
      The alt text is kept neutral so it doesn't give anything away.
    -->
    <div class="puzzle-24">
      <div class="poster-groups">
        <div class="poster-group">
          <figure class="poster"><img src="images/24/1.png" alt="Image 1" width="1000" height="1500"><span class="blank"></span></figure>
          <figure class="poster"><img src="images/24/2.png" alt="Image 2" width="1000" height="1500"><span class="blank"></span></figure>
          <figure class="poster"><img src="images/24/3.png" alt="Image 3" width="1000" height="1500"><span class="blank"></span></figure>
          <figure class="poster"><img src="images/24/4.png" alt="Image 4" width="1000" height="1500"><span class="blank"></span></figure>
        </div>
        <div class="poster-group">
          <figure class="poster"><img src="images/24/5.png" alt="Image 5" width="1000" height="1500"><span class="blank"></span></figure>
          <figure class="poster"><img src="images/24/6.png" alt="Image 6" width="1000" height="1500"><span class="blank"></span></figure>
          <figure class="poster"><img src="images/24/7.png" alt="Image 7" width="1000" height="1500"><span class="blank"></span></figure>
          <figure class="poster"><img src="images/24/8.png" alt="Image 8" width="1000" height="1500"><span class="blank"></span></figure>
        </div>
      </div>

      <!-- PART 2: the man with the laurel wreath "saying" eight more blank
           lines, also in two groups of four. -->
      <div class="speech">
        <img src="images/24/laurel.png" alt="Face" width="500" height="500">
        <span class="colon" aria-hidden="true">:</span>
        <div class="blank-lines">
          <div class="blank-group">
          <span class="blank"></span><span class="blank"></span><span class="blank"></span><span class="blank"></span>
          </div>
          <div class="blank-group">
          <span class="blank"></span><span class="blank"></span><span class="blank"></span><span class="blank"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ANSWER BOX. To change the answer, get a new fingerprint from tools/make-hash.html -->
    <form class="answer" data-puzzle="24"
          data-hash="a72f6b31af067f477a8c31e48e222e67b9ca94f812e692d302b7e604c5f897e5">
      <input type="text" aria-label="Answer" autocomplete="off" spellcheck="false">
      <button type="submit">Check</button>
      <p class="result" aria-live="polite"></p>
    </form>
  </main>

  <script src="check.js"></script>
</body>
</html>
