<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A</title>
  <!-- Loads the Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Logo (images/logo.png); its size is set by .hunt-title img in style.css -->
  <a class="hunt-title" href="index.html"><img src="images/logo.png" alt="A" width="139" height="120"></a>

  <main>
    <!-- No puzzle title here on purpose: this puzzle's name is just "A". -->

    <!--
      ANSWERS FROM THE OTHER PUZZLES
      These fill in by themselves once a solver has solved each puzzle
      (check.js looks up the saved answer for whatever nickname is in
      data-solved-for, which must match that puzzle's data-puzzle).
      Until then, each line is just blank space (in order: 24, bet, tom).
    -->
    <ul class="feeder-answers">
      <li class="solved-answer" data-solved-for="24"></li>
      <li class="solved-answer" data-solved-for="bet"></li>
      <li class="solved-answer" data-solved-for="tom"></li>
    </ul>

    <img src="images/final.png" alt="Puzzle image" width="1950" height="1700">

    <!-- ANSWER BOX. To change the answer, get a new fingerprint from tools/make-hash.html -->
    <form class="answer" data-puzzle="final"
          data-hash="169f7289fa8d2e76fc9b8e2bd2502245b2070672a67e59db6b8ff47787f0c6f8">
      <input type="text" aria-label="Answer" autocomplete="off" spellcheck="false">
      <button type="submit">Check</button>
      <p class="result" aria-live="polite"></p>
    </form>
  </main>

  <script src="check.js"></script>
</body>
</html>
